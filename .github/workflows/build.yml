name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Throwaway values for the temporary CI container only. Never reuse them anywhere real.
      MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd_2026"
      JWT_KEY: "ci-only-not-a-real-key-ci-only-not-a-real-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if shell scripts are stored with CRLF
        run: |
          if git ls-files --eol '*.sh' | grep -E 'i/(crlf|mixed)'; then
            echo "::error::Shell scripts must use LF line endings"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore ShopAPI.slnx

      - name: Build solution
        run: dotnet build ShopAPI.slnx --no-restore -c Release

      - name: Start SQL Server
        run: docker compose up -d db

      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/30)"
            sleep 3
          done
          echo "::error::SQL Server did not become ready in time"
          docker compose logs db
          exit 1

      - name: Build test database and run tests with coverage
        shell: pwsh
        run: |
          . ./Database/setup-test-db.ps1
          dotnet test ShopAPI.slnx --no-build -c Release --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx" "--collect:XPlat Code Coverage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'