name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if shell scripts are stored with CRLF
        run: |
          if git ls-files --eol '*.sh' | grep -E 'i/(crlf|mixed)'; then
            echo "::error::Shell scripts must use LF line endings"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore ShopAPI.slnx

      - name: Build solution
        run: dotnet build ShopAPI.slnx --no-restore -c Release

      - name: Run tests with coverage
        run: dotnet test ShopAPI.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'